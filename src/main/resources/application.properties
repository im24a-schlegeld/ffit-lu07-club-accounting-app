server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEY_STORE:classpath:keystore/keystore.p12}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/accounting}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

logging.level.root=INFO
logging.level.ch.bzz=DEBUG
logging.file.name=app.log
